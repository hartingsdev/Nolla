groups:
  - name: ledger-correctness
    rules:
      - alert: LedgerInvariantViolated
        expr: max(vst_invariant_violations) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Ledger invariant violated ({{ $labels.kind }})"
          description: "vst_invariant_violations is {{ $value }}. Money is wrong for at least one trip. Runbook: docs/runbooks/ledger-invariant.md"
      - alert: InvariantCheckStale
        expr: time() - vst_invariant_check_last_run_timestamp_seconds > 36 * 3600
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Nightly invariant check has not run for 36h"
      - alert: SettlementSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(vst_settlement_compute_seconds_bucket[10m]))) > 0.5
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Settlement p99 above 500 ms"

  - name: api-health
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "API target down" }
      - alert: HighErrorRate
        expr: |
          sum(rate(vst_http_requests_total{status=~"5.."}[5m])) / sum(rate(vst_http_requests_total[5m])) > 0.02
          and sum(rate(vst_http_requests_total[5m])) > 1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "5xx ratio above 2%" }
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le, route) (rate(vst_http_request_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "p95 latency above 1 s on {{ $labels.route }}" }
      - alert: ValidationFailureSpike
        expr: sum(rate(vst_entry_validation_failures_total[10m])) > 0.1
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Clients are sending invalid entries ({{ $value }}/s)" }
      - alert: WriteConflictsRising
        expr: sum(rate(vst_write_conflicts_total[15m])) > 0.05
        for: 15m
        labels: { severity: info }
        annotations: { summary: "409 conflicts rising" }

  - name: identity
    rules:
      - alert: AuthAbuse
        expr: sum(rate(vst_auth_attempts_total{result="rate_limited"}[5m])) > 1
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "Auth rate limiting firing continuously" }
      - alert: ScopeProbing
        expr: sum(rate(vst_trip_scope_denied_total[5m])) > 0.5
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "Many trip-scope denials: possible id enumeration" }

  - name: infrastructure
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Postgres exporter reports the database down" }
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) > 80
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Postgres connections above 80" }
