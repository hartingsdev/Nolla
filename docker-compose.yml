services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vst
      POSTGRES_PASSWORD: vst
      POSTGRES_DB: vst
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vst
      MINIO_ROOT_PASSWORD: vstvstvst
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
  miniodata:
