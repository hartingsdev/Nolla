name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:no-floats
      - name: Validate Prometheus rules and Grafana dashboards
        run: |
          # mounted at the path the config references, so credentials_file resolves
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          for f in ops/grafana/dashboards/*.json; do jq -e .uid "$f" > /dev/null; done
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1

  persistence-postgres:
    name: Persistence + API tests on real Postgres
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: vst, POSTGRES_PASSWORD: vst, POSTGRES_DB: vst }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vst" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-concurrency=1 --filter @vst/persistence --filter @vst/api test
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst
      - run: pnpm --filter @vst/persistence migrate && pnpm --filter @vst/persistence check-invariants
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst
      - name: Receipt retention job runs clean on an empty database
        run: pnpm --filter @vst/api retention --dry-run
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst
      - name: Boot the bundled API against Postgres and probe health + metrics
        run: |
          pnpm --filter @vst/api build
          (cd apps/api && node dist/main.mjs > /tmp/api.log 2>&1 &)
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9464/metrics)" = "401"
          curl -fsS -H 'Authorization: Bearer ci-metrics' localhost:9464/metrics | grep -q '^vst_http_requests_total'
          cat /tmp/api.log
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst
          METRICS_TOKEN: ci-metrics

  ui:
    name: UI click tests (Playwright, web build)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1
          EXPO_PUBLIC_API_URL: http://localhost:8090   # the e2e suite boots the API on PGlite on this port
      # No --with-deps: that runs apt-get update, which drags every third-party
      # repository on the runner image into this job. One of them (Google's Chrome
      # repo, which Playwright's own chromium does not need) served a Packages file
      # that did not match its Release hashes, apt exited 100, and the UI tests were
      # skipped without a single one running. The libraries it would install are
      # already on ubuntu-latest. If a future image drops one, chromium fails to
      # launch and every test says so loudly — put --with-deps back then.
      - run: pnpm --filter @vst/mobile exec playwright install chromium
      - run: pnpm --filter @vst/mobile e2e:only
        env:
          CI: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
