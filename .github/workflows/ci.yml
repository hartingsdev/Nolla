name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:no-floats
      - name: Validate Prometheus rules and Grafana dashboards
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
          for f in ops/grafana/dashboards/*.json; do jq -e .uid "$f" > /dev/null; done
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1

  persistence-postgres:
    name: Persistence + API tests on real Postgres
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: vst, POSTGRES_PASSWORD: vst, POSTGRES_DB: vst }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vst" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --workspace-concurrency=1 --filter @vst/persistence --filter @vst/api test
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst
      - run: pnpm --filter @vst/persistence migrate && pnpm --filter @vst/persistence check-invariants
        env:
          DATABASE_URL: postgres://vst:vst@localhost:5432/vst

  ui:
    name: UI click tests (Playwright, web build)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1
      - run: pnpm --filter @vst/mobile exec playwright install --with-deps chromium
      - run: pnpm --filter @vst/mobile e2e:only
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
