name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:no-floats
      - name: Validate Prometheus rules and Grafana dashboards
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /p/alerts.yml
          docker run --rm -v "$PWD/ops/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /p/prometheus.yml
          for f in ops/grafana/dashboards/*.json; do jq -e .uid "$f" > /dev/null; done
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1

  ui:
    name: UI click tests (Playwright, web build)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vst/mobile export:web
        env:
          CI: 1
      - run: pnpm --filter @vst/mobile exec playwright install --with-deps chromium
      - run: pnpm --filter @vst/mobile e2e:only
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
